name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead?
      description: Enough detail that someone can see the problem without asking a follow-up.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: The command, file, or steps. Leave this blank if it is not reproducible on demand.
