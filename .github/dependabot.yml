version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/assistant-backend
    schedule:
      interval: monthly
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        # Pre-1.0 lint/type tools ship breaking changes as minor bumps;
        # keep them as individual PRs so they don't block the group.
        exclude-patterns:
          - "ruff"
          - "pyrefly"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/assistant-ui
    schedule:
      interval: monthly
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /apps/assistant-backend
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/assistant-ui
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /apps/worker
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
