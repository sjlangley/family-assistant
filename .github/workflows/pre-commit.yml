name: pre-commit

# Runs the same hooks contributors run locally. Without this, the hooks are
# optional in practice: anyone who has not run `pre-commit install`, or who
# commits with --no-verify, bypasses every check.

on:
  pull_request:
    # No `types:` defaults to [opened, synchronize, reopened], which excludes
    # `edited` -- fired when a PR's base branch is changed (e.g. retargeting a
    # stacked branch onto main after its base merges), leaving this check
    # stale against the old base until something else pushes a new commit.
    types: [opened, reopened, edited, synchronize]
  push:
    branches: [main]

# `main` pushes group by ref rather than PR number, and are never cancelled: a
# superseded push would leave trunk with no green run against its head commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The full-history secret scan below reads every commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Both language layers have to exist before pre-commit runs: the pyrefly
      # hook resolves imports against the installed backend dependencies, and
      # the prettier, eslint and typecheck hooks run the frontend's own
      # binaries from node_modules. Without these the hooks fail with
      # "pyrefly: command not found" and missing-package errors rather than
      # silently checking with other versions.
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/assistant-backend[dev]"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/assistant-ui/package-lock.json

      # ci rather than install: it fails when the lock and package.json disagree.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/assistant-ui

      # Pinned so a new pre-commit release cannot change a CI result on its
      # own; bump in step with what contributors install locally.
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      # Reuse the built hook environments across runs; keyed on the hook
      # config so it invalidates when a hook or its version changes.
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      # The betterleaks hook in the run above only scans staged changes, which
      # is nothing in CI. This runs the manual-stage hook that scans the whole
      # git history with the same pinned scanner and .betterleaks.toml, so a
      # secret that was committed and later deleted still fails the job.
      - name: Scan full history for secrets
        run: pre-commit run betterleaks-history --all-files --hook-stage manual
